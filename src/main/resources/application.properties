#MS SQL Server資料庫設定
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ecpay_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1111}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#JPA/Hibernate 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#綠界金流測試環境參數(ECPay Stage)
#特店編號(MerchantID)
ecpay.payment.merchant_id=${ECPAY_MERCHANT_ID:3002607}
#串接金鑰(HashKey)
ecpay.payment.hash_key=${ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}
#串接金鑰(HashIV)
ecpay.payment.hash_iv=${ECPAY_HASH_IV:EkRm7iFT261dpevs}
#綠界測試API網址(這是Stage測試環境的結帳API接口)
ecpay.payment.checkout_url=https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/v5